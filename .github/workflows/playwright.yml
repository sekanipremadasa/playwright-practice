
name: Playwright Tests

# Run tests when code is pushed or a pull request is opened.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install project dependencies.
      - name: Install dependencies
        run: npm ci

      # Step 4: Install the Chromium browser and dependencies.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Step 5: Execute the automated tests.
      - name: Run Playwright tests
        run: npx playwright test

      # Step 6: Save the HTML report, even if a test fails.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
